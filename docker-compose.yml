services:
  db:
    image: postgres:17
    container_name: transparencia-db
    environment:
      POSTGRES_USER: senado
      POSTGRES_PASSWORD: senado
      POSTGRES_DB: transparencia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senado -d transparencia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: